name: WindowsHelmBusinessRun

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PrepareHelm
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'helm.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'helm-runtime'
          Invoke-WebRequest -Uri 'https://get.helm.sh/helm-v3.17.3-windows-amd64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force
          $helm = Join-Path $runtime 'windows-amd64\helm.exe'
          "HELM_BIN=$helm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $helm version --short
      - name: CheckFinalPackage
        shell: pwsh
        run: ./verification/windows_gate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-helm-evidence
          path: evidence/**/*
          if-no-files-found: error
          retention-days: 1
