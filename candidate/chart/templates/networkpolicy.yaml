{{- $contract := fromJson .Values.contract.document -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "feature-freeze.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "feature-freeze.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "feature-freeze.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $contract.orchestrator.pod_label }}
      ports:
        - protocol: TCP
          port: {{ $contract.orchestrator.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $contract.cluster_dns.namespace }}
          podSelector:
            matchLabels:
              k8s-app: {{ $contract.cluster_dns.pod_label }}
      ports:
      {{- range $contract.cluster_dns.protocols }}
        - protocol: {{ . }}
          port: {{ $contract.cluster_dns.port }}
      {{- end }}
    - to:
        - ipBlock:
            cidr: {{ $contract.object_store.cidr }}
      ports:
        - protocol: TCP
          port: {{ $contract.object_store.port }}
